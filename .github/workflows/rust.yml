name: Rust

on:
    push:
        branches: ['main']
        tags: ['v*']
    pull_request:
        branches: ['main']
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build
              run: cargo build --verbose
            - name: Run tests
              run: cargo test --verbose

    changelog:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        outputs:
            body: ${{ steps.cliff.outputs.content }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Generate changelog
              id: cliff
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: --latest --strip header

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build, changelog]
        permissions:
            contents: write
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: oxide
                      asset_name: oxide-linux
                    - os: windows-latest
                      artifact_name: oxide.exe
                      asset_name: oxide-windows.exe
                    - os: macos-latest
                      artifact_name: oxide
                      asset_name: oxide-macos
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Build release binary
              run: cargo build --release
            - name: Rename binary (Unix)
              if: matrix.os != 'windows-latest'
              run: mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}
            - name: Rename binary (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: Rename-Item target/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
            - name: Upload to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ needs.changelog.outputs.body }}
                  files: target/release/${{ matrix.asset_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
